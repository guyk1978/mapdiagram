  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up | MapDiagram</title>
  <meta name="description" content="Create your MapDiagram account or sign in to sync projects in the cloud.">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="manifest" href="/assets/site.webmanifest">
  <style>
    .auth-box{max-width:460px;margin:40px auto;background:#111a2e;border:1px solid #2d3b58;border-radius:14px;padding:16px;display:grid;gap:10px}
    .auth-box input{width:100%}
    .row{display:grid;gap:6px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .status{font-size:13px;color:#9fb0cc}
    .status.error{color:#ff9c9c}
    .status.success{color:#8be0b8}
  </style>
</head>
<body>
  <header class="nav"><div class="wrap"><strong>MapDiagram</strong><nav class="links"><a href="/">Home</a><a href="/diagram-builder/">Tools</a><a href="/workflow-hub/">Workflow Hub</a><a href="/blog/">Blog</a><a href="/about/">About</a><a class="btn" href="/app/">Open App</a></nav></div></header>
  <main class="wrap">
    <section class="hero article">
      <h1>Login or Create Account</h1>
      <p>Sign in to sync your projects to the cloud with Supabase.</p>
    </section>
    <section class="auth-box">
      <div class="row"><label for="emailInput">Email</label><input id="emailInput" type="email" placeholder="you@email.com"></div>
      <div class="row"><label for="passwordInput">Password</label><input id="passwordInput" type="password" placeholder="••••••••"></div>
      <div class="actions">
        <button id="loginBtn">Login</button>
        <button id="signupBtn">Sign Up</button>
        <button id="logoutBtn">Logout</button>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>
  <footer class="footer">
    <div class="wrap links">
      <a href="/privacy-policy/">Privacy Policy</a>
      <a href="/terms/">Terms</a>
      <a href="/contact/">Contact</a>
      <a href="https://joinmypdf.com/" rel="noopener noreferrer" target="_blank">Export workflow as PDF → JoinMyPDF</a>
    </div>
  </footer>
  <script src="/assets/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const statusEl = document.getElementById("status");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.classList.remove("error", "success");
      if (kind) statusEl.classList.add(kind);
    }

    function setLoading(button, loadingText, isLoading) {
      button.disabled = isLoading;
      if (isLoading) {
        button.dataset.prevText = button.textContent;
        button.textContent = loadingText;
      } else if (button.dataset.prevText) {
        button.textContent = button.dataset.prevText;
      }
    }

    const supabaseUrl = window.MAPDIAGRAM_SUPABASE?.url || window.MAPDIAGRAM_SUPABASE_URL || "";
    const supabaseKey = window.MAPDIAGRAM_SUPABASE?.anonKey || window.MAPDIAGRAM_SUPABASE_ANON_KEY || "";
    const safeRedirect = `${window.location.origin}/auth/callback/`;
    console.log("[Auth] Config loaded:", { hasUrl: !!supabaseUrl, hasKey: !!supabaseKey, hasLib: !!window.supabase, safeRedirect });

    if (!supabaseUrl || !supabaseKey) {
      setStatus("Supabase not configured", "error");
      console.error("[Auth] Missing MAPDIAGRAM_SUPABASE_URL or MAPDIAGRAM_SUPABASE_ANON_KEY");
    } else if (!window.supabase || !window.supabase.createClient) {
      setStatus("Supabase library failed to load", "error");
      console.error("[Auth] supabase is undefined");
    } else {
      const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
      console.log("[Auth] Supabase client initialized");

      supabaseClient.auth.getUser().then(({ data, error }) => {
        console.log("[Auth] getUser response:", { data, error });
        if (error) {
          setStatus(error.message, "error");
          return;
        }
        if (data?.user) setStatus(`Logged in as ${data.user.email}`, "success");
      });

      loginBtn.addEventListener("click", async () => {
        console.log("[Auth] Login click");
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        setLoading(loginBtn, "Loading...", true);
        setStatus("Signing in...");
        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          console.log("[Auth] signInWithPassword response:", { data, error });
          if (error) {
            setStatus(error.message, "error");
          } else {
            setStatus("Logged in. Redirecting...", "success");
            window.location.href = "/app/";
          }
        } catch (err) {
          console.error("[Auth] Login exception:", err);
          setStatus("Unexpected login error", "error");
        } finally {
          setLoading(loginBtn, "Loading...", false);
        }
      });

      signupBtn.addEventListener("click", async () => {
        console.log("[Auth] Sign Up click");
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        setLoading(signupBtn, "Loading...", true);
        setStatus("Creating account...");
        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: safeRedirect }
          });
          console.log("[Auth] signUp response:", { data, error });
          if (error) {
            setStatus(error.message, "error");
          } else {
            setStatus("Check your email to confirm account", "success");
          }
        } catch (err) {
          console.error("[Auth] Sign Up exception:", err);
          setStatus("Unexpected sign up error", "error");
        } finally {
          setLoading(signupBtn, "Loading...", false);
        }
      });

      logoutBtn.addEventListener("click", async () => {
        console.log("[Auth] Logout click");
        setLoading(logoutBtn, "Loading...", true);
        try {
          const { error } = await supabaseClient.auth.signOut();
          console.log("[Auth] signOut response:", { error });
          setStatus(error ? error.message : "Logged out.", error ? "error" : "success");
        } catch (err) {
          console.error("[Auth] Logout exception:", err);
          setStatus("Unexpected logout error", "error");
        } finally {
          setLoading(logoutBtn, "Loading...", false);
        }
      });
    }
  </script>
<script src="/shared/share-dock.js" defer></script>
</body>
</html>
