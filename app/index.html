  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapDiagram App | Interactive Diagram Editor</title>
  <meta name="description" content="Open the MapDiagram editor and create diagrams interactively in your browser.">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="manifest" href="/assets/site.webmanifest">
  <script src="/assets/theme-engine.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    .app-shell { height: calc(100vh - 64px); }
    iframe { width: 100%; height: 100%; border: 0; background: var(--bg, #0b1020); }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <strong>MapDiagram</strong>
      <nav class="links">
        <a href="/">Home</a>
        <a href="/diagram-builder/">Tools</a>
        <a href="/workflow-hub/">Workflow Hub</a>
        <a href="/blog/">Blog</a>
        <a href="/about/">About</a>
        <a href="https://joinmypdf.com/" rel="noopener noreferrer" target="_blank">Export workflow as PDF → JoinMyPDF</a>
        <a href="/auth/">Login</a>
        <button type="button" id="shellThemeToggle" class="btn" style="min-width:auto;padding:8px 12px;font-size:12px" title="Toggle light / dark">Theme</button>
        <a class="btn" href="/app/">Open App</a>
      </nav>
    </div>
  </header>
  <main class="app-shell"><iframe id="editorFrame" src="/app/tool.html" title="MapDiagram editor"></iframe></main>
<script>
(function () {
  function pushThemeToIframe() {
    var fr = document.getElementById("editorFrame");
    if (!fr || !fr.contentWindow) return;
    var m = window.MapDiagramTheme ? MapDiagramTheme.get() : "dark";
    try {
      fr.contentWindow.postMessage({ type: "mapdiagram-theme-sync", mode: m }, "*");
    } catch (_) {}
  }
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "mapdiagram-theme" || e.data.source !== "mapdiagram-tool") return;
    if (window.MapDiagramTheme) MapDiagramTheme.set(e.data.mode === "light" ? "light" : "dark");
  });
  window.addEventListener("load", function () {
    var fr = document.getElementById("editorFrame");
    if (fr) fr.addEventListener("load", pushThemeToIframe);
    pushThemeToIframe();
  });
  var shellTheme = document.getElementById("shellThemeToggle");
  if (shellTheme) {
    shellTheme.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      if (window.MapDiagramTheme) MapDiagramTheme.set(next);
      pushThemeToIframe();
    });
  }
})();
</script>
</body>
</html>
